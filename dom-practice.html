<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .highlight { background-color: yellow; }
        .container { padding: 20px; border: 1px solid #ccc; }
        .completed { text-decoration: line-through; color: #888; }
        .dark { background: #111; color: #fff; }
        .dark .container { background: #222; }
        .error { border: 2px solid red !important; }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>DOM Practice</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <article>
            <h2 class="title">Article Title</h2>
            <p class="content">This is the first paragraph.</p>
            <p class="content">This is the second paragraph.</p>
        </article>
        <section>
            <h2>Form Section</h2>
            <form id="contact-form">
                <input type="text" id="name" name="name" placeholder="Name">
                <input type="email" id="email" name="email" placeholder="Email">
                <button type="submit">Submit</button>
            </form>
        </section>
        <section>
            <h2>Daily Challenges</h2>
            <button onclick="colorChanger()">Day 1: Color Changer</button>
            <button onclick="addParagraph()">Day 2: Add Paragraph</button>
            <button onclick="removeImages()">Day 3: Remove Images</button>
            <button onclick="copyContent()">Day 4: Copy Content</button>
            <button onclick="darkModeToggle()">Day 5: Dark Mode</button>
            <div id="source-div"><p>Source content to copy</p></div>
            <div id="target-div"><p>Target will be filled here</p></div>
            <img src="https://via.placeholder.com/100" alt="demo image">
        </section>
    </main>
    <footer><p>&copy; 2026</p></footer>
    <script src="dom.js"></script>
</body>
</html>
